<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StackUp — Offline</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; height: 100vh; display: grid; place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f7f8fa; color: #1f2430;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #16181d; color: #e7e9ee; }
      }
      .card { text-align: center; max-width: 340px; padding: 32px; }
      .mark {
        width: 56px; height: 56px; border-radius: 14px; background: #7B68EE;
        display: grid; place-items: center; margin: 0 auto 20px;
      }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { font-size: 14px; opacity: 0.7; line-height: 1.5; margin: 0 0 20px; }
      button {
        border: 0; background: #7B68EE; color: #fff; font-weight: 600;
        padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">
        <svg width="30" height="30" viewBox="0 0 512 512" fill="none" stroke="white" stroke-width="34" stroke-linejoin="round">
          <path d="M256 96 416 168 256 240 96 168z" />
          <path d="M96 256 256 328 416 256" />
          <path d="M96 344 256 416 416 344" />
        </svg>
      </div>
      <h1>You're offline</h1>
      <p>StackUp can't reach the network right now. Your work is safe — reconnect to pick up where you left off.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
