# Fly.io config for the StackUp API.
# Rename `app` to something unique, then: fly launch --no-deploy && fly deploy.
# Set secrets first (never commit them):
#   fly secrets set APP_DB_URL="postgresql://stackup_app:PW@ep-…neon.tech/neondb?sslmode=require" \
#                   JWT_SECRET="<random 32+ chars>" \
#                   WEB_ORIGINS="https://stackup.github.io"

app = "stackup-api"
# iad = Ashburn, next to Neon's AWS us-east-1 for low DB latency.
primary_region = "iad"

[build]

[http_service]
  internal_port = 3000
  force_https = true
  # Keep one machine always on: the realtime SSE bus + presence are in-process,
  # so the API must not sleep or scale to zero (that's the Phase-2 change).
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
