<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>StackUp</title>
<style>
  /* Branded fallback shown only when the live app is unreachable; normally the
     remote app loads immediately. */
  html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  body{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#7B68EE,#5B4BD5);color:#fff;text-align:center}
  .wrap{padding:32px;max-width:340px}
  .mark{width:72px;height:72px;border-radius:18px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
  h1{font-size:1.6rem;margin:0 0 8px}
  p{opacity:.9;line-height:1.5;margin:0 0 20px}
  button{background:#fff;color:#5B4BD5;border:none;border-radius:10px;padding:12px 22px;font-size:1rem;font-weight:700;cursor:pointer}
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark">
      <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round">
        <path d="M12 3 21 7.5 12 12 3 7.5z"/><path d="M3 12 12 16.5 21 12"/><path d="M3 16.5 12 21 21 16.5"/>
      </svg>
    </div>
    <h1>StackUp</h1>
    <p>You appear to be offline. Reconnect to get back to your workspace.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
